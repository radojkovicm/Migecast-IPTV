[Application]
name = MigeCast IPTV
version = 1.0.0
author = Mige
organization = MigeCast

[Paths]
cache_dir = cache
data_dir = data
logs_dir = logs

[Playlists]
auto_refresh = true
refresh_interval_days = 7

[Display]
max_channels = Sve
max_vod = Sve

[Player]
timeshift_buffer_gb = 5
reconnect_attempts = 3
hw_acceleration = true
default_volume = 70
network_cache_ms = 1000
live_cache_ms = 1000

[UI]
theme = light
font_family = Segoe UI
font_size = 14
high_contrast = false